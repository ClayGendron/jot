[package]
name = "jot"
version = "0.1.0"
description = "A lightweight, fast, cross-platform markdown editor"
authors = ["Jot Contributors"]
edition = "2021"

[lib]
name = "jot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
similar = "2.6"
regex = "1"
glob = "0.3"
tempfile = "3"
