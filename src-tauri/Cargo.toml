[package]
name = "jot"
version = "0.1.0"
description = "A lightweight, fast, cross-platform markdown editor"
authors = ["Jot Contributors"]
edition = "2021"

[lib]
name = "jot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
similar = "2.6"
regex = "1"
glob = "0.3"
tempfile = "3"
trash = "5"
once_cell = "1"

# Candle ML framework for embeddings
candle-core = "0.9.2"
candle-nn = "0.9.2"
candle-transformers = "0.9.2"
tokenizers = "0.21.1"
hf-hub = "0.4.3"

# macOS: Metal GPU acceleration
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.9.2", features = ["metal", "accelerate"] }
candle-nn = { version = "0.9.2", features = ["metal", "accelerate"] }
candle-transformers = { version = "0.9.2", features = ["metal", "accelerate"] }
